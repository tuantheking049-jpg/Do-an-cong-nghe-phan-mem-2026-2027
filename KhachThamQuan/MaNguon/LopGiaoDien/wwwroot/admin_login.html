<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Quản trị - AudioGuide</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Chống cuộn trang */
        }

        /* Hình nền Du lịch mờ (Có thể tự đổi link ảnh Sóc Trăng vào url) */
        .bg-image {
            background-image: url('https://images.unsplash.com/photo-1559592413-7cec4d0cae2b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80'); 
            background-size: cover;
            background-position: center;
            height: 110%; /* Tràn viền để làm mờ không bị hở mép */
            width: 110%;
            position: absolute;
            top: -5%;
            left: -5%;
            filter: blur(8px) brightness(0.85); /* Làm mờ 8px và tối đi một chút */
            z-index: -1;
        }

        .login-wrapper {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Thẻ form thiết kế bo góc, kính mờ */
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 420px;
            padding: 45px 35px;
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-icon {
            font-size: 3.5rem;
            color: #0d6efd;
            margin-bottom: 5px;
            display: inline-block;
            text-shadow: 0 4px 15px rgba(13, 110, 253, 0.3);
        }

        /* Khung nhập liệu (Input) */
        .input-group-text {
            background-color: #f4f6f8;
            border: 2px solid #eef0f2;
            border-right: none;
            border-radius: 14px 0 0 14px;
            color: #6c757d;
            padding: 15px;
        }

        .form-control {
            background-color: #f4f6f8;
            border: 2px solid #eef0f2;
            border-left: none;
            padding: 15px 15px 15px 0;
            border-radius: 0 14px 14px 0;
            color: #212529;
            font-weight: 500;
            font-size: 1.05rem;
        }

        /* Hiệu ứng khi click vào khung nhập liệu */
        .form-control:focus {
            background-color: #fff;
            border-color: #0d6efd;
            box-shadow: none;
        }
        
        .form-control:focus + .input-group-text,
        .input-group:focus-within .input-group-text,
        .input-group:focus-within .form-control {
            background-color: #fff;
            border-color: #0d6efd;
            color: #0d6efd;
        }

        /* Nút đăng nhập */
        .btn-login {
            background: linear-gradient(135deg, #0d6efd, #0b5ed7);
            border: none;
            border-radius: 14px;
            padding: 15px;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 20px rgba(13, 110, 253, 0.25);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #0b5ed7, #0a53be);
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(13, 110, 253, 0.4);
        }
    </style>
</head>
<body>
    
    <!-- Lớp nền mờ -->
    <div class="bg-image"></div>
    
    <!-- Nội dung canh giữa -->
    <div class="login-wrapper">
        <div class="login-card">
            
            <i class="bi bi-geo-alt-fill logo-icon"></i>
            <h3 class="fw-bold text-dark mb-1">AudioGuide Admin</h3>
            <p class="text-muted small mb-4">Hệ thống Hướng dẫn Du lịch Sóc Trăng</p>
            
            <!-- Khu vực hiện thông báo lỗi -->
            <div id="error-msg" class="alert alert-danger d-none py-2 small rounded-3 mb-4 fw-medium text-start" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> Tài khoản hoặc mật khẩu không chính xác!
            </div>
            <!-- THÊM MỚI: Khu vực hiện thông báo đăng xuất -->
            <div id="logout-msg" class="alert alert-success d-none py-2 small" role="alert">
                Đã đăng xuất. Phiên đăng nhập đã hết hạn!
            </div>

            <!-- Thay thẻ <form> bằng <div> để lách cảnh báo lộ mật khẩu của Google Chrome -->
            <div id="loginFormContainer">
                <div class="mb-3 text-start">
                    <label class="form-label fw-semibold small text-secondary ms-1">Tên đăng nhập</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                        <!-- Tắt autocomplete để Chrome không nhảy gợi ý linh tinh -->
                        <input type="text" class="form-control" id="username" placeholder="Nhập admin..." autocomplete="off" spellcheck="false">
                    </div>
                </div>
                
                <div class="mb-4 text-start">
                    <label class="form-label fw-semibold small text-secondary ms-1">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <!-- Đổi id thành pwd_secret và dùng new-password để Chrome không nhận diện đây là mật khẩu yếu -->
                        <input type="password" class="form-control" id="pwd_secret" placeholder="Nhập 123..." autocomplete="new-password">
                    </div>
                </div>
                
                <button type="button" id="btnLogin" class="btn btn-primary w-100 btn-login text-white">ĐĂNG NHẬP</button>
            </div>
            
        </div>
    </div>

    <!-- Script Xử Lý Logic (Không dùng thẻ form submit) -->
    <script>
        // BẮT TÍN HIỆU ĐĂNG XUẤT TỪ URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('logout') === 'true') {
            // Hiện thông báo màu xanh
            document.getElementById('logout-msg').classList.remove('d-none');
            // Dọn dẹp cái đuôi "?logout=true" trên thanh địa chỉ đi cho nó gọn gàng
            window.history.replaceState(null, null, window.location.pathname);
        }
        
        function processLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('pwd_secret').value;
            const errorBox = document.getElementById('error-msg');

            // Reset trạng thái lỗi
            errorBox.classList.add('d-none');

            // Validate rỗng
            if(user === '' || pass === '') {
                errorBox.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-1"></i> Vui lòng nhập đầy đủ thông tin!';
                errorBox.classList.remove('d-none');
                return;
            }

            // GIẢ LẬP XÁC THỰC (Sau này gọi API xuống C# ở đây)
            if (user === 'admin' && pass === '123') {
                // Lưu session đăng nhập
                sessionStorage.setItem('isAdminLoggedIn', 'true');
                
                // Hiển thị hiệu ứng loading trên nút
                const btn = document.getElementById('btnLogin');
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Đang vào...';
                btn.classList.add('disabled');
                
                // Chuyển hướng sau nửa giây cho mượt
                setTimeout(() => {
                    window.location.href = 'admin_dashboard.html';
                }, 500);

            } else {
                // Sai tài khoản
                errorBox.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-1"></i> Tài khoản hoặc mật khẩu không chính xác!';
                errorBox.classList.remove('d-none');
            }
        }

        // Bắt sự kiện Click nút
        document.getElementById('btnLogin').addEventListener('click', processLogin);

        // Bắt sự kiện Enter (Vì mình bỏ thẻ <form> nên phải tự code phím Enter)
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                processLogin();
            }
        });
    </script>
</body>
</html>
