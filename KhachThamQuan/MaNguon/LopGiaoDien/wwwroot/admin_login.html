<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Quản trị - AudioGuide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .login-header {
            background-color: #212529;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .login-body {
            background-color: white;
            padding: 30px;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #0d6efd;
        }
    </style>
</head>
<body>

    <div class="card login-card">
        <div class="login-header">
            <h4 class="fw-bold mb-0"><i class="bi bi-geo-alt-fill text-primary me-2"></i>AudioGuide Admin</h4>
            <p class="text-muted small mt-2 mb-0">Đăng nhập hệ thống quản trị</p>
        </div>
        <div class="login-body">
            <!-- Khu vực hiện thông báo lỗi -->
            <div id="error-msg" class="alert alert-danger d-none py-2 small" role="alert">
                Tài khoản hoặc mật khẩu không chính xác!
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label fw-medium small text-secondary">Tên đăng nhập</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" placeholder="Nhập admin..." required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-medium small text-secondary">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="Nhập 123456..." required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2">ĐĂNG NHẬP</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Chặn tải lại trang

            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const errorBox = document.getElementById('error-msg');

            // GIẢ LẬP XÁC THỰC (Sau này thay bằng API gọi xuống Backend C#)
            if (user === 'admin' && pass === '123456') {
                errorBox.classList.add('d-none');
                
                // Lưu trạng thái đăng nhập vào Session của trình duyệt
                sessionStorage.setItem('isAdminLoggedIn', 'true');
                
                // Chuyển hướng sang trang Dashboard
                window.location.href = 'admin_dashboard.html';
            } else {
                // Sai tài khoản
                errorBox.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
